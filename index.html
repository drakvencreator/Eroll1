
<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Japan Erolli | Pjesë Japoneze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Saira', sans-serif;
        background-color: #050505;
        color: #e5e5e5;
        overflow-x: hidden;
      }
      .font-aggressive {
        font-family: 'Saira', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      
      /* CLIP PATHS */
      .skew-cut { clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); }
      .skew-cut-reverse { clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%); }
      .clip-polygon { clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%); }

      /* ANIMATIONS */
      
      /* 1. Rumble/Vibration */
      @keyframes rumble {
        0% { transform: translate(0, 0) scale(1.0); }
        25% { transform: translate(-1px, 1px) scale(1.01); }
        50% { transform: translate(1px, -1px) scale(1.01); }
        75% { transform: translate(-1px, -1px) scale(1.01); }
        100% { transform: translate(0, 0) scale(1.0); }
      }
      .animate-rumble { animation: rumble 0.2s infinite linear; }
      .hover-rumble:hover { animation: rumble 0.2s infinite linear; }

      /* 2. Speed Pan Background */
      @keyframes speed-pan {
        0% { transform: scale(1.05) translateX(0); }
        100% { transform: scale(1.15) translateX(-15px); }
      }
      .animate-speed { animation: speed-pan 10s infinite alternate ease-in-out; }

      /* 3. Aggressive Glitch Effect */
      @keyframes glitch-skew {
        0% { transform: skew(0deg); }
        20% { transform: skew(-2deg); }
        40% { transform: skew(2deg); }
        60% { transform: skew(-1deg); }
        80% { transform: skew(1deg); }
        100% { transform: skew(0deg); }
      }
      .animate-glitch { animation: glitch-skew 0.5s infinite; }
      .hover-glitch:hover { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; }

      /* 3.1 Cyber Glitch Image Effect (NEW AGGRESSIVE) */
      @keyframes cyber-glitch-img {
        0% { clip-path: inset(50% 0 30% 0); transform: translate(-5px, 0); opacity: 0.5; }
        20% { clip-path: inset(10% 0 60% 0); transform: translate(5px, 0); opacity: 0.7;}
        40% { clip-path: inset(80% 0 5% 0); transform: translate(-5px, 0); opacity: 0.3;}
        60% { clip-path: inset(10% 0 40% 0); transform: translate(5px, 0); opacity: 0.6;}
        80% { clip-path: inset(40% 0 10% 0); transform: translate(-5px, 0); opacity: 0.8;}
        100% { clip-path: inset(50% 0 30% 0); transform: translate(0, 0); opacity: 0.4;}
      }
      .animate-cyber-glitch { animation: cyber-glitch-img 2.5s infinite steps(20) alternate-reverse; }

      /* 4. Slide Ins */
      @keyframes slide-in-left {
        0% { opacity: 0; transform: translateX(-100px) skewX(20deg); filter: blur(10px); }
        100% { opacity: 1; transform: translateX(0) skewX(0); filter: blur(0); }
      }
      @keyframes slide-in-right {
        0% { opacity: 0; transform: translateX(100px) skewX(-20deg); filter: blur(10px); }
        100% { opacity: 1; transform: translateX(0) skewX(0); filter: blur(0); }
      }
      @keyframes slide-up {
        0% { opacity: 0; transform: translateY(50px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-left { animation: slide-in-left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .animate-slide-right { animation: slide-in-right 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .animate-slide-up { animation: slide-up 0.6s ease-out forwards; }
      
      /* 5. Flash/Pulse */
      @keyframes flash-red {
        0%, 100% { text-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
        50% { text-shadow: 0 0 25px rgba(220, 38, 38, 1), 0 0 5px rgba(255, 255, 255, 0.5); }
      }
      .animate-flash { animation: flash-red 2s infinite; }

      /* 6. Floating Particles */
      @keyframes float-1 {
          0%, 100% { transform: translate(0, 0); opacity: 0; }
          50% { opacity: 1; }
          100% { transform: translate(50px, -50px); opacity: 0; }
      }
      @keyframes float-2 {
          0%, 100% { transform: translate(0, 0); opacity: 0; }
          50% { opacity: 0.8; }
          100% { transform: translate(-30px, -80px); opacity: 0; }
      }
      @keyframes float-3 {
          0%, 100% { transform: translate(0, 0); opacity: 0; }
          50% { opacity: 0.6; }
          100% { transform: translate(20px, -40px); opacity: 0; }
      }
      .animate-float-1 { animation: float-1 4s infinite linear; }
      .animate-float-2 { animation: float-2 6s infinite linear; animation-delay: 1s; }
      .animate-float-3 { animation: float-3 5s infinite linear; animation-delay: 2s; }

      /* 7. Scanline */
      .scanline {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
        background-size: 100% 4px;
        animation: scanline 10s linear infinite;
      }
      @keyframes scanline {
        0% { background-position: 0 0; }
        100% { background-position: 0 100%; }
      }

      /* 8. TV Noise / Grain */
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }

      /* Utilities */
      .text-outline-white { -webkit-text-stroke: 1px white; color: transparent; }
      .text-outline-red { -webkit-text-stroke: 1px #dc2626; color: transparent; }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #991b1b; }
    </style>
