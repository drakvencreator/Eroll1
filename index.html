<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Japan Erolli | Pjesë Japoneze</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Saira', sans-serif;
        background-color: #0a0a0a;
        color: #e5e5e5;
      }
      .font-aggressive {
        font-family: 'Saira', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
      }
      .skew-cut {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      }
      .skew-cut-reverse {
        clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%);
      }
      
      /* Animacion për efektin e 'vozitjes' ose vibrimit të motorit */
      @keyframes rumble {
        0% { transform: translate(0, 0) scale(1.1); }
        25% { transform: translate(-1px, 1px) scale(1.1); }
        50% { transform: translate(1px, -1px) scale(1.1); }
        75% { transform: translate(-1px, -1px) scale(1.1); }
        100% { transform: translate(0, 0) scale(1.1); }
      }
      
      @keyframes speed-pan {
        0% { transform: scale(1.1) translateX(0); }
        100% { transform: scale(1.2) translateX(-20px); }
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-rumble {
        animation: rumble 0.2s infinite linear;
      }
      
      .animate-speed {
        animation: speed-pan 10s infinite alternate ease-in-out;
      }
      
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
    </style>

}
</script>
</head>

</html>
